<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FraudGuard</title>
  <style>
    body {
      width: 350px;
      padding: 0;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
    }
    .header p {
      margin: 5px 0 0 0;
      font-size: 12px;
      opacity: 0.9;
    }
    .content {
      padding: 20px;
    }
    .status {
      text-align: center;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .status.active {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .status-text {
      font-size: 14px;
      font-weight: 500;
    }
    .current-url {
      font-size: 12px;
      color: #666;
      word-break: break-all;
      margin-top: 10px;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 4px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }
    .btn {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #667eea;
      color: white;
    }
    .btn-primary:hover {
      background: #5568d3;
    }
    .btn-secondary {
      background: #f5f5f5;
      color: #333;
    }
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    .footer {
      padding: 15px;
      text-align: center;
      font-size: 11px;
      color: #999;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛡️ FraudGuard</h1>
    <p>AI-Powered Fraud Detection</p>
  </div>
  
  <div class="content">
    <div class="status" id="status">
      <div class="status-text">Monitoring active tab...</div>
    </div>
    
    <div class="current-url" id="currentUrl">
      Loading...
    </div>
    
    <div class="actions">
      <button class="btn btn-primary" id="analyzeBtn">Analyze Current Page</button>
      <button class="btn btn-secondary" id="settingsBtn">Settings</button>
    </div>
  </div>
  
  <div class="footer">
    FraudGuard v1.0.0
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
